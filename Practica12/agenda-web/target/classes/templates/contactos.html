<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agenda de Contactos</title>
    <style>
        body    { font-family: Arial, sans-serif; background: #1a1a2e;
                  color: #e0e0e0; display: flex; justify-content: center;
                  margin: 0; padding: 60px 16px; }
        .caja   { background: #16213e; padding: 40px; border-radius: 12px;
                  border: 1px solid #4a90d9; width: 100%; max-width: 820px; }
        h1      { color: #f0c040; text-align: center; margin: 0 0 24px; }
        .nuevo  { display: inline-block; margin-bottom: 20px; padding: 10px 18px;
                  background: #4a90d9; color: #fff; text-decoration: none;
                  border-radius: 6px; }
        .nuevo:hover, .nuevo:focus-visible { background: #3b7bbf; }
        .tabla  { overflow-x: auto; }
        table   { width: 100%; border-collapse: collapse; }
        th, td  { padding: 12px; text-align: left;
                  border-bottom: 1px solid #0f3460; }
        th      { color: #aaa; font-size: .9em; font-weight: normal;
                  background: #0f3460; }
        tbody tr:hover { background: #1b2a4e; }
        .vacio  { text-align: center; padding: 32px 0; color: #aaa; }
    </style>
</head>
<body>
    <div class="caja">
        <h1>Agenda de Contactos</h1>

        <a class="nuevo" th:href="@{/nuevo}">Agregar contacto</a>

        <!-- Tabla: solo si hay contactos -->
        <div class="tabla" th:unless="${#lists.isEmpty(contactos)}">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${contactos}">
                        <td th:text="${c.nombre}">-</td>
                        <td th:text="${c.apellido}">-</td>
                        <td th:text="${c.email}">-</td>
                        <td th:text="${c.telefono}">-</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Mensaje: solo si la lista está vacía -->
        <p class="vacio" th:if="${#lists.isEmpty(contactos)}">
            Todavía no hay contactos. Usa «Agregar contacto» para crear el primero.
        </p>
    </div>
</body>
</html>
